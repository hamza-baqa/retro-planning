<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBS One · Pilotage budgétaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2EE;
  --surface:#FFFFFF;
  --surface-2:#F9F7F4;
  --chip:#EFECE8;
  --ink:#1E1B17;
  --ink-2:#4A443D;
  --muted:#7B746A;
  --line:#E7E1D9;
  --line-2:#D8D0C5;
  --orange:#EC6511;
  --orange-hover:#D35607;
  --orange-soft:#FCEBDD;
  --red:#C2391F;
  --red-soft:#FBE9E4;
  --amber:#AA7006;
  --amber-soft:#F8EED6;
  --green:#2D7A4C;
  --green-soft:#E3F0E7;
  --bar-eng:#3E3832;
  --bar-raf:#CDC4B8;
  --shadow:0 1px 2px rgba(70,45,20,.04),0 10px 30px -18px rgba(70,45,20,.18);
  --focus:0 0 0 3px rgba(236,101,17,.38);
  --r-lg:18px; --r-md:12px;
  --topbar:76px;
  --gutter:32px;
  --font:"Nunito Sans","Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#161412; --surface:#201D1A; --surface-2:#282420; --chip:#2F2A26;
  --ink:#F3EFE9; --ink-2:#D3CBC1; --muted:#9C9389; --line:#35302B; --line-2:#4A433C;
  --orange:#F27427; --orange-hover:#FF8B42; --orange-soft:rgba(242,116,39,.16);
  --red:#F27C64; --red-soft:rgba(242,124,100,.15);
  --amber:#E7B14C; --amber-soft:rgba(231,177,76,.15);
  --green:#6DC290; --green-soft:rgba(109,194,144,.14);
  --bar-eng:#DCD4C9; --bar-raf:#5B534B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -18px rgba(0,0,0,.6);
  color-scheme:dark;
}
@media (max-width:640px){:root{--gutter:16px;--topbar:64px}}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased;transition:background-color .25s,color .25s}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:8px}
.num{font-variant-numeric:tabular-nums lining-nums}
.wrap{max-width:1440px;margin:0 auto;padding:0 var(--gutter)}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.tone-red{color:var(--red)} .tone-amber{color:var(--amber)} .tone-green{color:var(--green)} .tone-muted{color:var(--muted)}
.unit{font-size:.52em;font-weight:600;letter-spacing:.03em;margin-left:.22em;text-transform:uppercase;opacity:.85}

/* ---------- Barre supérieure ---------- */
.topbar{position:sticky;top:0;z-index:40;height:var(--topbar);background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{height:100%;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:20px;text-decoration:none;min-width:0}
.brand-logo{display:flex;flex-direction:column;align-items:flex-end;color:var(--orange);font-weight:800;font-size:12px;line-height:1;letter-spacing:.04em;text-transform:uppercase}
.brand-logo img{height:40px;width:auto;display:block}
.brand-sep{width:1px;height:38px;background:var(--line-2)}
.brand-app{min-width:0}
.brand-app strong{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.brand-app span{display:block;font-size:15px;color:var(--muted);white-space:nowrap}
.topnav{display:flex;gap:2px;margin-left:auto}
.topnav a{padding:9px 15px;border-radius:999px;text-decoration:none;font-weight:700;font-size:14.5px;color:var(--ink-2);transition:background .15s,color .15s}
.topnav a:hover{background:var(--surface-2);color:var(--ink)}
.topnav a[aria-current="page"]{background:var(--orange-soft);color:var(--orange-hover)}
[data-theme="dark"] .topnav a[aria-current="page"]{color:var(--orange)}
.theme-btn{flex:none;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;transition:border-color .15s}
.theme-btn:hover{border-color:var(--line-2)}
@media (max-width:1080px){.topnav{display:none}.theme-btn{margin-left:auto}}
@media (max-width:640px){.brand{gap:12px}.brand-logo{font-size:10px}.brand-app strong{font-size:17px}.brand-app span{font-size:13px}.theme-btn{width:42px;height:42px}}

/* ---------- Mise en page ---------- */
.page{padding-top:22px;padding-bottom:72px}
.eyebrow{margin:0;font-size:13px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.h1{margin:12px 0 0;font-size:clamp(30px,3.3vw,46px);line-height:1.08;font-weight:800;letter-spacing:-.022em}
.lead{margin:16px 0 0;max-width:72ch;font-size:clamp(16px,1.25vw,19px);color:var(--ink-2);line-height:1.62}
.block-title{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:60px 0 18px}
.link-quiet{font-size:14.5px;font-weight:700;color:var(--orange-hover);text-decoration:none}
[data-theme="dark"] .link-quiet{color:var(--orange)}
.link-quiet:hover{text-decoration:underline;text-underline-offset:3px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}

/* ---------- Bandeau d'indicateurs ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.kpi{background:var(--surface);padding:30px 34px 28px}
.kpi-label{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.kpi-value{margin-top:8px;font-size:clamp(30px,2.6vw,40px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi-sub{margin-top:8px;font-size:15px;color:var(--muted)}
@media (max-width:640px){.kpi{padding:20px 20px 18px}}

/* ---------- Cartes d'instance ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,370px),1fr));gap:28px}
.icard{--status:var(--red);container-type:inline-size;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--status);border-radius:var(--r-lg);padding:34px 38px 30px;box-shadow:var(--shadow)}
.icard.ok{--status:var(--green)}
.icard h3{margin:0;font-size:clamp(21px,1.75vw,26px);font-weight:800;letter-spacing:-.012em;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 15px;border-radius:999px;background:var(--chip);font-size:15px;color:var(--muted);white-space:nowrap}
.icard .label{margin-top:30px}
.icard .edition{margin:6px 0 0;font-size:clamp(18px,1.4vw,21px);font-weight:800}
.badge{display:inline-flex;align-items:center;gap:10px;padding:7px 16px;border-radius:999px;background:var(--red-soft);color:var(--red);font-weight:800;font-size:15.5px;white-space:nowrap}
.badge::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--green-soft);color:var(--green)}
.icard .badge{margin-top:18px;align-self:flex-start}
.icard .summary{margin:30px 0 0;color:var(--ink-2);font-size:16.5px;line-height:1.66;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:calc(1.66em * 3)}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:30px}
.mini{display:flex;flex-direction:column;justify-content:space-between;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px 12px;min-width:0}
.mini-label{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-value{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:2px;font-size:23px;font-weight:800;line-height:1.15;white-space:nowrap}
.mini-value .unit{margin-left:.2em}
.icard .actions{margin-top:auto;padding-top:28px}
.btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:17px 20px;border:0;border-radius:var(--r-md);background:var(--orange);color:#fff;font-weight:800;font-size:18px;text-decoration:none;cursor:pointer;transition:background .15s}
.btn-primary:hover{background:var(--orange-hover)}
.btn-primary .arrow{display:inline-block;transition:transform .2s}
.btn-primary:hover .arrow{transform:translateX(4px)}
.prev-eds{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1px solid var(--line);font-size:15px;color:var(--muted)}
.pill-link{padding:6px 14px;border:1px solid var(--line-2);border-radius:999px;text-decoration:none;color:var(--ink-2);font-variant-numeric:tabular-nums;transition:border-color .15s,color .15s}
.pill-link:hover{border-color:var(--orange);color:var(--orange)}
@container (max-width:520px){.minis{gap:10px}.mini{padding:12px 12px 10px}.mini-label{white-space:normal;font-size:11.5px;letter-spacing:.06em;line-height:1.25}.mini-value{font-size:20px}}
@media (max-width:640px){.icard{padding:26px 20px 22px}.minis{gap:8px}.mini{padding:11px 10px 10px}}

/* ---------- Tableaux ---------- */
.tbl-wrap{position:relative;overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{padding:14px 16px;text-align:left;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:15px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl td.r{font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tbody tr.clickable{cursor:pointer}
.tbl tbody tr.clickable:hover td,.tbl tbody tr.clickable:focus-visible td{background:var(--surface-2)}
.tbl tbody tr.clickable:focus-visible{outline:none;box-shadow:inset 3px 0 0 var(--orange)}
.tbl tfoot td{font-weight:800;border-top:2px solid var(--line-2);background:var(--surface-2);font-variant-numeric:tabular-nums}
.tbl tfoot td:first-child{border-bottom-left-radius:var(--r-lg)}
.tbl tfoot td:last-child{border-bottom-right-radius:var(--r-lg)}
.sort-btn{border:0;background:none;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.sort-btn:hover{color:var(--ink)}
.sort-btn .ind{opacity:0;font-size:10px}
.sort-btn[data-dir] .ind{opacity:1;color:var(--orange)}
.env-name{font-weight:800;display:block}
.env-owner{display:block;font-size:13.5px;color:var(--muted)}
.cell-strong{font-weight:800}

/* Barre de consommation */
.cbar{position:relative;height:12px;min-width:150px}
.cbar .track{position:absolute;inset:0;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.cbar .track span{position:absolute;top:0;bottom:0}
.cbar .eng{left:0;background:var(--bar-eng)}
.cbar .raf{background:var(--bar-raf)}
.cbar .over{background:repeating-linear-gradient(135deg,var(--red) 0 3px,transparent 3px 6px);opacity:.95}
.cbar .mark{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--ink);border-radius:2px}
.cbar-wrap{display:flex;align-items:center;gap:12px}
.cbar-wrap .pct{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.legend{display:flex;gap:10px 22px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px}
.legend i.l-eng{background:var(--bar-eng)} .legend i.l-raf{background:var(--bar-raf)}
.legend i.l-over{background:repeating-linear-gradient(135deg,var(--red) 0 3px,transparent 3px 6px);border:1px solid var(--red)}
.legend i.l-mark{width:2px;height:16px;background:var(--ink)}
.legend i.l-line{width:20px;height:3px;background:var(--orange)}
.legend i.l-dash{width:20px;height:0;border-top:2px dashed var(--ink-2);border-radius:0}

/* ---------- Tableau de bord ---------- */
.crumbs{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.crumbs a{text-decoration:none;transition:color .15s}
.crumbs a:hover{color:var(--orange)}
.crumbs .sep{opacity:.45}
.dash-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px 32px;flex-wrap:wrap}
.edition-line{display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap;margin-top:16px}
.edition-line .when{font-size:clamp(18px,1.5vw,21px);font-weight:800}
.switcher{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.switcher-label{font-size:14px;color:var(--muted);margin-right:4px}
.seg{display:inline-flex;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;gap:2px}
.seg a,.seg button{padding:8px 15px;border-radius:999px;text-decoration:none;font-weight:700;font-size:14.5px;color:var(--ink-2);border:0;background:none;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap;transition:background .15s,color .15s}
.seg a:hover,.seg button:hover{background:var(--surface-2)}
.seg [aria-current="page"],.seg [aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg [aria-current="page"]:hover,.seg [aria-pressed="true"]:hover{background:var(--ink)}
.icon-btn{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;text-decoration:none;color:var(--ink);transition:border-color .15s}
.icon-btn:hover{border-color:var(--line-2)}
.icon-btn[aria-disabled="true"]{opacity:.35;pointer-events:none}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;padding:10px 17px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:none;transition:border-color .15s}
.btn-ghost:hover{border-color:var(--ink-2)}

.dash-kpis{margin-top:30px}
.subnav{position:sticky;top:var(--topbar);z-index:30;margin:30px calc(-1 * var(--gutter)) 0;padding:0 var(--gutter);background:var(--bg);border-bottom:1px solid var(--line)}
@supports (backdrop-filter:blur(8px)){.subnav{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.2) blur(12px)}}
.subnav-inner{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.subnav-inner::-webkit-scrollbar{display:none}
.subnav button{flex:none;display:flex;gap:8px;align-items:center;padding:15px 12px 12px;border:0;border-bottom:3px solid transparent;background:none;font-weight:700;font-size:15px;color:var(--muted);cursor:pointer;transition:color .15s,border-color .2s}
.subnav button:hover{color:var(--ink)}
.subnav button.active{color:var(--ink);border-bottom-color:var(--orange)}
.subnav .count{font-size:12px;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--red-soft);color:var(--red)}
.dsec{margin-top:40px;scroll-margin-top:calc(var(--topbar) + 70px)}
.dsec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;margin-bottom:16px}
.dsec-head h2{margin:0;font-size:clamp(21px,1.8vw,25px);font-weight:800;letter-spacing:-.012em}
.dsec-head p{margin:4px 0 0;color:var(--muted);font-size:15px;max-width:70ch}
.pad{padding:28px 32px}
@media (max-width:640px){.pad{padding:20px 18px}}

/* Synthèse */
.synth{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr)}
.synth-main{padding:34px 38px}
.synth-text{margin:0;font-size:clamp(18px,1.45vw,21px);line-height:1.55;font-weight:600;max-width:62ch}
.msgs{list-style:none;margin:26px 0 0;padding:22px 0 0;border-top:1px solid var(--line);display:grid;gap:14px;max-width:70ch}
.msgs li{display:grid;grid-template-columns:auto 1fr;gap:14px;color:var(--ink-2);line-height:1.55}
.msgs li::before{content:"";width:7px;height:7px;border-radius:50%;margin-top:.62em;background:var(--orange)}
.synth-side{border-left:1px solid var(--line);padding:30px 32px;background:var(--surface-2);display:grid;gap:22px;align-content:start;border-radius:0 var(--r-lg) var(--r-lg) 0}
.stat-label{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stat-value{margin-top:2px;font-size:24px;font-weight:800;line-height:1.2}
.stat-sub{font-size:14px;color:var(--muted)}
.link-btn{border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit;text-align:left;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px;text-decoration-thickness:2px;transition:text-decoration-color .15s}
.link-btn:hover{text-decoration-color:var(--orange)}
@media (max-width:900px){.synth{grid-template-columns:1fr}.synth-side{border-left:0;border-top:1px solid var(--line);border-radius:0 0 var(--r-lg) var(--r-lg);grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.synth-main{padding:24px 20px}}

/* Graphique de trajectoire */
.chart{position:relative;margin-top:8px}
.chart svg{display:block;overflow:visible}
.chart .gridline{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:12.5px;font-family:var(--font);font-variant-numeric:tabular-nums}
.chart .env-line{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:6 5}
.chart .env-label{fill:var(--ink-2);font-size:12.5px;font-weight:700;font-family:var(--font)}
.chart .area{fill:var(--red);opacity:.12}
.chart .line{fill:none;stroke:var(--orange);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--surface);stroke:var(--orange);stroke-width:2.5}
.chart .dot.last{fill:var(--orange)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:focus{outline:none}
.chart .hit:focus-visible + .dot,.chart .pt:hover .dot{stroke-width:4}
.chart .val{fill:var(--ink);font-size:13px;font-weight:800;font-family:var(--font)}
.draw{animation:draw 1.1s cubic-bezier(.4,0,.2,1) both}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:var(--surface);padding:10px 13px;border-radius:10px;font-size:13.5px;line-height:1.45;transform:translate(-50%,calc(-100% - 16px));white-space:nowrap;opacity:0;transition:opacity .12s}
.tip.show{opacity:1}
.tip b{font-weight:800}
.chart-foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}

/* Phasage */
.phase{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:end;height:280px;padding:10px 4px 0;border-bottom:1px solid var(--line-2)}
.phase-col{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:100%}
.pbar{position:relative;width:min(64px,38%);border-radius:8px 8px 0 0;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.pbar.budget{background:repeating-linear-gradient(135deg,var(--line-2) 0 2px,transparent 2px 7px);border:2px solid var(--line-2);border-bottom:0}
.pbar.att{background:var(--bar-eng)}
.pbar.att.over{background:var(--red)}
.pbar .pv{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);padding-bottom:6px;font-size:13px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.phase-labels{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:12px;text-align:center}
.phase-labels strong{display:block;font-size:17px}
.phase-labels span{font-size:14px;font-variant-numeric:tabular-nums}
.legend i.l-budget{background:repeating-linear-gradient(135deg,var(--line-2) 0 2px,transparent 2px 5px);border:1px solid var(--line-2)}
.legend i.l-att{background:var(--bar-eng)} .legend i.l-att-over{background:var(--red)}

/* Contingence */
.cont-cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.cont-cell{background:var(--surface);padding:16px 18px}
.cont-cell .stat-value{font-size:22px}
.stack-row{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;margin-top:20px}
.stack-row[hidden]{display:none}
.stack-row .stack-label{font-size:14px;font-weight:700;color:var(--ink-2)}
.stack{display:flex;height:24px;border-radius:999px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.stack span{height:100%;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.stack .s-used{background:var(--bar-eng)}
.stack .s-gap{background:var(--red)}
.stack .s-free{background:var(--green)}
.legend i.l-used{background:var(--bar-eng)} .legend i.l-gap{background:var(--red)} .legend i.l-free{background:var(--green)}
.sim-note{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-top:20px;padding:14px 18px;border-radius:var(--r-md);background:var(--orange-soft);color:var(--ink);font-size:15px}
.sim-note[hidden]{display:none}
.req-list{margin-top:26px;border-top:1px solid var(--line)}
.req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 28px;padding:20px 0;border-bottom:1px solid var(--line);align-items:center}
.req:last-child{border-bottom:0}
.req-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.req-id{font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--chip);color:var(--ink-2)}
.tag.green{background:var(--green-soft);color:var(--green)} .tag.red{background:var(--red-soft);color:var(--red)} .tag.amber{background:var(--amber-soft);color:var(--amber)}
.req-title{margin:6px 0 8px;font-weight:800;font-size:17px;line-height:1.35}
.req-meta{display:flex;gap:6px 20px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.req-meta b{font-weight:700;color:var(--ink-2)}
.req-side{display:flex;align-items:center;gap:18px}
.req-amount{font-size:20px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.decide{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;gap:2px;background:var(--surface)}
.decide button{border:0;background:none;padding:8px 15px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink-2);transition:background .15s,color .15s}
.decide button:hover{background:var(--surface-2)}
.decide button.ok[aria-pressed="true"]{background:var(--green);color:#fff}
.decide button.ko[aria-pressed="true"]{background:var(--red);color:#fff}
[data-theme="dark"] .decide button[aria-pressed="true"]{color:#161412}
@media (max-width:760px){.req{grid-template-columns:1fr}.req-side{justify-content:space-between}.stack-row{grid-template-columns:1fr;gap:8px}}

/* Alertes */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fchip{padding:8px 15px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.fchip:hover{border-color:var(--ink-2)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.alert{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:10px 24px;padding:22px 0;border-bottom:1px solid var(--line);align-items:start}
.alert:last-child{border-bottom:0}
.alert[hidden]{display:none}
.lvl{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.lvl::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.lvl.critique{color:var(--red)} .lvl.vigilance{color:var(--amber)} .lvl.info{color:var(--green)}
.alert h3{margin:0;font-size:17px;font-weight:800;line-height:1.35}
.alert p{margin:6px 0 10px;color:var(--ink-2);max-width:75ch}
.alert-impact{font-size:20px;font-weight:800;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.alert-impact small{display:block;font-size:12.5px;font-weight:600;color:var(--muted)}
.empty{padding:28px 0;color:var(--muted)}
@media (max-width:760px){.alert{grid-template-columns:1fr auto}.alert .lvl{grid-column:1 / -1}}

/* Autres instances */
.others{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.other{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 24px;text-decoration:none;transition:border-color .15s}
.other:hover{border-color:var(--orange)}
.other strong{display:block;font-size:17px;font-weight:800}
.other span{font-size:14.5px;color:var(--muted)}
.other .go{flex:none;font-weight:800;color:var(--orange)}

/* ---------- Panneau latéral ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(25,18,10,.38);opacity:0;transition:opacity .22s}
.overlay.show{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(500px,100%);background:var(--surface);transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s linear .3s;display:flex;flex-direction:column;box-shadow:-24px 0 60px -24px rgba(0,0,0,.3);visibility:hidden}
.drawer.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s}
.drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:26px 28px 20px;border-bottom:1px solid var(--line)}
.drawer-head h2{margin:6px 0 2px;font-size:24px;font-weight:800;line-height:1.2}
.drawer-body{flex:1;overflow-y:auto;padding:24px 28px 28px}
.drawer-foot{display:flex;justify-content:space-between;gap:12px;padding:16px 28px;border-top:1px solid var(--line)}
.d-big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.d-big .v{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-top:22px}
.d-grid > div{background:var(--surface);padding:14px 16px}
.d-grid .stat-value{font-size:20px}
.d-sec{margin-top:28px}
.d-sec h3{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.d-sec p{margin:0;color:var(--ink-2);line-height:1.6}
.d-item{padding:12px 0;border-top:1px solid var(--line)}
.d-item:first-of-type{border-top:0;padding-top:0}
.d-item strong{display:block;font-weight:800}
.d-item span{font-size:14px;color:var(--muted)}

/* ---------- Notification ---------- */
.toast{position:fixed;left:50%;bottom:28px;z-index:80;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:999px;font-weight:700;font-size:14.5px;transition:opacity .2s,transform .2s;box-shadow:0 12px 30px -10px rgba(0,0,0,.35)}
.toast.show{opacity:1;transform:translate(-50%,0)}


.subnav .count.n{background:var(--chip);color:var(--ink-2)}
main:focus,main:focus-visible{outline:none;box-shadow:none}
.chart .dot{pointer-events:none}
.overlay[hidden]{display:none}

/* ---------- Impression et accessibilité ---------- */
@media print{
  :root{--bg:#fff}
  .topbar,.subnav,.switcher,.theme-btn,.decide,.filters,.overlay,.drawer,.toast,.others-block{display:none!important}
  .panel,.kpis{box-shadow:none}
  .dsec{break-inside:avoid}
  body{font-size:13px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

<script>

const r1 = n => Math.round(n * 10) / 10;
const fmt = n => nf1.format(r1(n));
const fmtTrim = n => { const v = r1(n); return Number.isInteger(v) ? nf0.format(v) : nf1.format(v); };
const signed = (n, trim = false) => {
  const v = r1(n); const s = v > 0 ? '+' : v < 0 ? '−' : '';
  return s + (trim ? fmtTrim(Math.abs(v)) : fmt(Math.abs(v)));
};
const signedPct = n => (n > 0 ? '+' : n < 0 ? '−' : '') + pf1.format(Math.abs(n));

/* ---------- Modèle ---------- */
const instIndex = id => INSTANCES.findIndex(i => i.id === id);
const instById = id => INSTANCES.find(i => i.id === id);
const envById = id => ENVELOPPES.find(e => e.id === id);
const edKey = ed => ed.instance + '/' + ed.date;
const edHash = ed => '#/seance/' + edKey(ed);
const editionsOf = id => EDITIONS.filter(e => e.instance === id).sort((a, b) => b.date.localeCompare(a.date));
const latestOf = id => editionsOf(id)[0];
const byRecent = (a, b) => b.date.localeCompare(a.date) || instIndex(a.instance) - instIndex(b.instance);
const latestOverall = () => [...EDITIONS].sort(byRecent)[0];

const calcCache = new Map();
function calc(ed) {
  if (calcCache.has(ed)) return calcCache.get(ed);
  const rows = ENVELOPPES.map(e => {
    const [att, eng] = ed.etat[e.id];
    return { ...e, att, eng, raf: r1(att - eng), ecart: r1(att - e.budget), delta: r1(ed.delta.env[e.id] || 0) };
  });
  const sum = k => r1(rows.reduce((s, r) => s + r[k], 0));
  const att = sum('att'), eng = sum('eng'), budget = sum('budget');
  const ecart = r1(att - budget);
  const crit = ed.alertes.filter(a => a[1] === 'critique').length;
  const statut = ecart > ed.contingenceRestante
    ? { cls: '', txt: 'Dépassement du budget total' }
    : ecart > 0 ? { cls: '', txt: 'Dépassement des enveloppes' } : { cls: 'ok', txt: 'Dans les enveloppes' };
  const c = {
    rows, att, eng, budget, ecart, statut, crit,
    raf: r1(att - eng),
    delta: sum('delta'),
    ecartPct: ecart / budget,
    enDepassement: rows.filter(r => r.ecart > 0).length,
    pire: rows.reduce((a, b) => (b.ecart > a.ecart ? b : a)),
    marge: r1(ed.contingenceRestante - ecart)
  };
  calcCache.set(ed, c);
  return c;
}

const toneEcart = v => (v > 0 ? 'tone-red' : 'tone-green');
const toneDelta = v => (v === 0 ? 'tone-muted' : v < 0 ? 'tone-green' : v < 5 ? 'tone-amber' : 'tone-red');

const kpi = (label, value, sub, tone = '') =>
  `<div class="kpi"><div class="kpi-label">${label}</div><div class="kpi-value num ${tone}">${value}</div><div class="kpi-sub">${sub}</div></div>`;

function kpiStrip(ed, c, ctx) {
  return `<div class="kpis">
    ${kpi('Budget total', fmt(PROGRAMME.budgetTotal) + U, `enveloppes ${fmt(c.budget)} + contingence`)}
    ${kpi('Atterrissage', fmt(c.att) + U, 'engagé + reste à faire', c.att > c.budget ? 'tone-red' : '')}
    ${kpi('Écart vs enveloppes', signed(c.ecart) + U, `${signedPct(c.ecartPct)} · ${c.ecart > 0 ? 'Dépassement' : 'Sous les enveloppes'}`, toneEcart(c.ecart))}
    ${kpi('Δ dernière séance', signed(c.delta, true) + U, ctx === 'dash' ? `vs ${esc(ed.delta.ref)}` : "évolution de l'atterrissage", toneDelta(c.delta))}
    ${kpi('Contingence restante', fmt(ed.contingenceRestante) + U, 'réserve disponible pour couvrir les écarts')}
  </div>`;
}

function cbar(r) {
  const max = Math.max(r.budget, r.att) * 1.04;
  const wEng = r.eng / max * 100, wAtt = r.att / max * 100, wBud = r.budget / max * 100;
  const over = r.att > r.budget ? `<span class="over" style="left:${wBud}%;width:${wAtt - wBud}%"></span>` : '';
  return `<div class="cbar-wrap"><div class="cbar" style="flex:1" role="img" aria-label="Engagé ${fmt(r.eng)}, reste à faire ${fmt(r.raf)}, budget ${fmt(r.budget)} MMAD">
      <div class="track"><span class="eng" style="width:${wEng}%"></span><span class="raf" style="left:${wEng}%;width:${wAtt - wEng}%"></span>${over}</div>
      <span class="mark" style="left:${wBud}%"></span></div><span class="pct">${pf.format(r.att / r.budget)}</span></div>`;
}

function reqItem([id, statut, echeance]) {

  return `<div class="req" data-req="${id}">

      <div class="req-top"><span class="req-id">${d.ref}</span><span class="tag">${TYPE_DEMANDE[d.type]}</span>${fige}</div>

}

    ${inst.sections.map(s => SECTIONS[s](ed, c, inst)).join('')}

    <section class="dsec others-block">
      <div class="dsec-head"><div><h2>Autres instances</h2></div></div>
      <div class="others">${INSTANCES.filter(x => x.id !== inst.id).map(x => {
        const e = latestOf(x.id), cc = calc(e);
        return `<a class="panel other" href="${edHash(e)}"><div><strong>${esc(x.nom)}</strong><span>Séance du ${dShort(e.date)}, écart ${signed(cc.ecart)} MMAD</span></div><span class="go" aria-hidden="true">→</span></a>`;
      }).join('')}</div>
    </section>
  </div>`;

  mountDashboard(ed, c);
}

function mountDashboard(ed, c) {
  /* Tableau des enveloppes */
  if ($('#envTable')) {
    let sort = { k: null, dir: null };
    renderEnvRows(c, sort);
    $('#envTable thead').addEventListener('click', e => {
      const b = e.target.closest('[data-sort]'); if (!b) return;
      const k = b.dataset.sort;
      const dir = sort.k === k ? (sort.dir === 'desc' ? 'asc' : 'desc') : (k === 'nom' ? 'asc' : 'desc');
      sort = { k, dir };
      $$('#envTable th[data-k]').forEach(th => {
        const on = th.dataset.k === k, sb = $('.sort-btn', th);
        th.setAttribute('aria-sort', on ? (dir === 'asc' ? 'ascending' : 'descending') : 'none');
        if (on) { sb.dataset.dir = dir; $('.ind', sb).textContent = dir === 'asc' ? '▲' : '▼'; } else delete sb.dataset.dir;
      });
      renderEnvRows(c, sort);
    });
  }

  /* Trajectoire */
  const tc = $('#trajChart');
  if (tc) {
    drawTrajectory(tc, ed, !reduceMotion.matches);
    watchResize(tc, () => drawTrajectory(tc, ed, false));
    const show = h => showTip(tc, +h.dataset.i);
    tc.addEventListener('pointerover', e => { const h = e.target.closest('.hit'); if (h) show(h); });
    tc.addEventListener('pointerout', e => { if (e.target.closest('.hit')) hideTip(tc); });
    tc.addEventListener('focusin', e => { const h = e.target.closest('.hit'); if (h) show(h); });
    tc.addEventListener('focusout', () => hideTip(tc));
  } else watchResize(null);

  /* Phasage */
  if ($('#phaseBars')) {
    const sim = SIM[edKey(ed)] || {};
    const d6 = ed.demandes.find(d => DEMANDES[d[0]].type === 'phasage');
    setPhase(d6 && sim[d6[0]] === 'refusee' ? 'sansReport' : 'avecReport');
  }

  /* Contingence et simulation */
  if ($('#contCells')) {
    const sim = SIM[edKey(ed)] || {};
    $$('[data-decide]').forEach(b => b.setAttribute('aria-pressed', String(sim[b.dataset.id] === b.dataset.decide)));
    renderCont(ed, c);
  }

  setupSpy();
}

function renderEnvRows(c, sort) {
  const rows = [...c.rows];
  if (sort.k) {
    rows.sort((a, b) => (sort.k === 'nom' ? a.nom.localeCompare(b.nom, 'fr') : a[sort.k] - b[sort.k]));
    if (sort.dir === 'desc') rows.reverse();
  }
  $('#envTable tbody').innerHTML = rows.map(r => `
    <tr class="clickable" tabindex="0" data-env="${r.id}">
      <td><span class="env-name">${esc(r.nom)}</span><span class="env-owner">${esc(r.porteur)}</span></td>
      <td class="r">${fmt(r.budget)}</td>
      <td class="r">${fmt(r.eng)}</td>
      <td class="r">${fmt(r.raf)}</td>
      <td class="r cell-strong">${fmt(r.att)}</td>
      <td class="r cell-strong ${r.ecart > 0 ? 'tone-red' : r.ecart < 0 ? 'tone-green' : ''}">${signed(r.ecart)}</td>
      <td class="r ${toneDelta(r.delta)}">${r.delta ? signed(r.delta) : '—'}</td>
      <td>${cbar(r)}</td>
    </tr>`).join('');
}

/* ---------- Graphique de trajectoire ---------- */
function trajPoints(ed) {
  const pts = HISTORIQUE.filter(h => h.date < ed.date).map(h => ({ ...h }));
  editionsOf(ed.instance).filter(e => e.date < ed.date).forEach(e => {
    const p = { date: e.date, att: calc(e).att, source: instById(e.instance).court };
    const k = pts.findIndex(x => x.date === e.date);
    if (k >= 0) pts[k] = p; else pts.push(p);
  });
  pts.push({ date: ed.date, att: calc(ed).att, source: 'Cette séance', current: true });
  return pts.sort((a, b) => a.date.localeCompare(b.date));
}

function drawTrajectory(el, ed, animate) {
  const pts = trajPoints(ed), env = calc(ed).budget;
  const W = Math.max(300, el.clientWidth), small = W < 640, H = small ? 250 : 320;
  const m = { t: 34, r: small ? 14 : 24, b: 40, l: 46 };
  const vals = pts.map(p => p.att).concat(env), step = 10;
  const lo = Math.floor((Math.min(...vals) - 4) / step) * step;
  const hi = Math.ceil((Math.max(...vals) + 6) / step) * step;
  const ts = pts.map(p => toDate(p.date).getTime()), t0 = ts[0], t1 = ts[ts.length - 1];
  const X = t => m.l + (t1 === t0 ? 0.5 : (t - t0) / (t1 - t0)) * (W - m.l - m.r);
  const Y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
  const xy = pts.map((p, i) => [X(ts[i]), Y(p.att)]);
  const yEnv = Y(env);

  let grid = '';
  for (let v = lo; v <= hi; v += step) {
    grid += `<line class="gridline" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${m.l - 10}" y="${Y(v) + 4}" text-anchor="end">${nf0.format(v)}</text>`;
  }
  const line = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
  const area = `M${xy[0][0]},${yEnv}` + xy.map(p => `L${p[0]},${p[1]}`).join('') + `L${xy[xy.length - 1][0]},${yEnv}Z`;
  let len = 0;
  for (let i = 1; i < xy.length; i++) len += Math.hypot(xy[i][0] - xy[i - 1][0], xy[i][1] - xy[i - 1][1]);

  const showLabel = i => !small || i === 0 || i === pts.length - 1 || i % 2 === 0;
  const xLabels = pts.map((p, i) => showLabel(i)
    ? `<text class="axis" x="${xy[i][0]}" y="${H - 12}" text-anchor="${i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'}">${dTiny(p.date)}</text>` : '').join('');
  const dots = pts.map((p, i) => `<g class="pt">
      <circle class="hit" cx="${xy[i][0]}" cy="${xy[i][1]}" r="16" tabindex="0" data-i="${i}" role="img" aria-label="${dShort(p.date)}, ${esc(p.source)} : ${fmt(p.att)} MMAD"/>
      <circle class="dot${p.current ? ' last' : ''}" cx="${xy[i][0]}" cy="${xy[i][1]}" r="${p.current ? 6.5 : 5}" style="pointer-events:none"/>
    </g>`).join('');
  const last = xy[xy.length - 1];

  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-label="Trajectoire de l'atterrissage">
      <defs><clipPath id="clipAbove"><rect x="0" y="0" width="${W}" height="${Math.max(0, yEnv)}"/></clipPath></defs>
      ${grid}
      <path class="area" d="${area}" clip-path="url(#clipAbove)"/>
      <line class="env-line" x1="${m.l}" x2="${W - m.r}" y1="${yEnv}" y2="${yEnv}"/>
      <text class="env-label" x="${W - m.r}" y="${yEnv + 20}" text-anchor="end">Enveloppes ${fmt(env)}</text>
      <path class="line${animate ? ' draw' : ''}" d="${line}" style="stroke-dasharray:${len};--len:${len}"/>
      ${dots}${xLabels}
      <text class="val" x="${last[0]}" y="${last[1] - 16}" text-anchor="end">${fmt(pts[pts.length - 1].att)}</text>
    </svg><div class="tip" aria-hidden="true"></div>`;
  el._pts = pts; el._xy = xy; el._env = env; el._w = W;
}

function showTip(el, i) {
  const p = el._pts[i], [x, y] = el._xy[i], tip = $('.tip', el);
  tip.innerHTML = `<b>${dShort(p.date)}</b>, ${esc(p.source)}<br>Atterrissage <b>${fmt(p.att)} MMAD</b><br>Écart vs enveloppes <b>${signed(p.att - el._env)}</b>`;
  tip.style.left = Math.min(Math.max(x, 120), el._w - 120) + 'px';
  tip.style.top = y + 'px';
  tip.classList.add('show');
}
const hideTip = el => $('.tip', el)?.classList.remove('show');

let resizeObs = null;
function watchResize(el, fn) {
  resizeObs?.disconnect(); resizeObs = null;
  if (!el || !('ResizeObserver' in window)) return;
  let w = el.clientWidth;
  resizeObs = new ResizeObserver(() => { if (Math.abs(el.clientWidth - w) > 4) { w = el.clientWidth; fn(); } });
  resizeObs.observe(el);
}

/* ---------- Phasage ---------- */
function setPhase(scen) {
  $$('[data-phase]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.phase === scen)));
  const ph = currentEd.phasage, years = Object.keys(ph.budget), cur = ph[scen];
  const max = Math.max(...years.flatMap(y => [ph.budget[y], ph.avecReport[y], ph.sansReport[y]])) * 1.14;
  const wrap = $('#phaseBars');
  if (!wrap.children.length) {
    wrap.innerHTML = years.map(y => `<div class="phase-col">
      <div class="pbar budget" data-y="${y}" style="height:0"><span class="pv"></span></div>
      <div class="pbar att" data-y="${y}" style="height:0"><span class="pv"></span></div></div>`).join('');
    void wrap.offsetHeight;
  }
  years.forEach(y => {
    const b = $(`.pbar.budget[data-y="${y}"]`, wrap), a = $(`.pbar.att[data-y="${y}"]`, wrap);
    b.style.height = (ph.budget[y] / max * 100) + '%'; $('.pv', b).textContent = fmt(ph.budget[y]);
    a.style.height = (cur[y] / max * 100) + '%'; $('.pv', a).textContent = fmt(cur[y]);
    a.classList.toggle('over', cur[y] > ph.budget[y] + 0.05);
  });
  $('#phaseLabels').innerHTML = years.map(y => {
    const d = r1(cur[y] - ph.budget[y]);
    return `<div><strong>${y}</strong><span class="${d > 0 ? 'tone-red' : 'tone-green'}">${signed(d)} MMAD vs enveloppe</span></div>`;
  }).join('');
  const pire = years.reduce((a, y) => (cur[y] - ph.budget[y] > cur[a] - ph.budget[a] ? y : a), years[0]);
  const dp = fmt(cur[pire] - ph.budget[pire]);
  const report = fmt(Math.abs(ph.sansReport[2026] - ph.avecReport[2026]));
  $('#phaseNote').innerHTML = scen === 'avecReport'
    ? `<span>Avec le report de ${report} MMAD, l'exercice ${pire} dépasse son enveloppe de <b class="tone-red">${dp} MMAD</b> : écart d'exercice à valider.</span><span>Total inchangé : ${fmt(years.reduce((s, y) => s + cur[y], 0))} MMAD</span>`
    : `<span>Sans report, l'exercice ${pire} dépasse son enveloppe de <b class="tone-red">${dp} MMAD</b>.</span><span>Total inchangé : ${fmt(years.reduce((s, y) => s + cur[y], 0))} MMAD</span>`;
}

/* ---------- Contingence et simulation ---------- */
function contState(ed, c, sim) {
  let mob = 0, eco = 0, nVal = 0, nRef = 0;
  ed.demandes.forEach(([id, statut]) => {
    if (statut !== 'attente') return;
    const d = DEMANDES[id], s = sim[id];
    if (s === 'refusee') nRef++;
    if (s === 'validee') {
      nVal++;
      if (d.type === 'contingence') mob += d.montant;
      else if (d.type === 'economie') eco += d.montant;
    }
  });
  const deja = r1(PROGRAMME.contingenceInitiale - ed.contingenceRestante);
  const rest = r1(ed.contingenceRestante - mob), ecart = r1(c.ecart - mob - eco);
  return { init: PROGRAMME.contingenceInitiale, deja, mob: r1(mob), eco: r1(eco), used: r1(deja + mob), rest, ecart, marge: r1(rest - ecart), nVal, nRef };
}

function setStack(row, st) {
  const parts = [st.used, Math.max(0, st.ecart), Math.max(0, st.marge)];
  const tot = parts.reduce((a, b) => a + b, 0) || 1;
  const spans = $$('.stack span', row);
  spans.forEach((s, i) => { s.style.width = (parts[i] / tot * 100).toFixed(2) + '%'; });
  $('.stack', row).setAttribute('role', 'img');
  $('.stack', row).setAttribute('aria-label', `Mobilisée ${fmt(st.used)}, écart à couvrir ${fmt(parts[1])}, marge ${fmt(st.marge)} MMAD`);
}

function renderCont(ed, c) {
  const sim = SIM[edKey(ed)] || {};
  const base = contState(ed, c, {}), s = contState(ed, c, sim);
  const actif = s.nVal + s.nRef > 0;
  const cell = (label, v, sub, tone = '') =>
    `<div class="cont-cell"><div class="stat-label">${label}</div><div class="stat-value num ${tone}">${fmt(v)}${U}</div><div class="stat-sub">${sub}</div></div>`;
  $('#contCells').innerHTML =
    cell('Contingence initiale', s.init, 'au lancement du programme') +
    cell('Déjà mobilisée', s.used, actif && s.mob ? `dont ${fmt(s.mob)} simulés` : 'arbitrages antérieurs') +
    cell('Contingence restante', s.rest, actif ? `figé : ${fmt(base.rest)}` : 'disponible à date') +
    cell('Écart à couvrir', Math.max(0, s.ecart), actif ? `figé : ${fmt(base.ecart)}` : 'atterrissage − enveloppes', s.ecart > 0 ? 'tone-red' : 'tone-green') +
    cell('Marge après couverture', s.marge, actif && s.eco ? `dont ${fmt(s.eco)} d'économies simulées` : 'restante − écart à couvrir', 'tone-green');

  const baseRow = $('#stackBase'), simRow = $('#stackSim');
  setStack(baseRow, base);
  if (actif) {
    const etaitCache = simRow.hidden;
    simRow.hidden = false;
    if (etaitCache) { setStack(simRow, base); void simRow.offsetWidth; }
    setStack(simRow, s);
  } else simRow.hidden = true;

  const note = $('#simNote');
  if (actif) {
    const parts = [];
    if (s.nVal) parts.push(`${s.nVal} validée${s.nVal > 1 ? 's' : ''}`);
    if (s.nRef) parts.push(`${s.nRef} refusée${s.nRef > 1 ? 's' : ''}`);
    note.innerHTML = `<span><b>Simulation en cours</b> (${parts.join(', ')}) : écart vs enveloppes <b class="num">${signed(s.ecart)} MMAD</b>, contingence restante <b class="num">${fmt(s.rest)} MMAD</b>.</span>
      <button type="button" class="btn-ghost" data-action="reset-sim">Réinitialiser la simulation</button>`;
    note.hidden = false;
  } else note.hidden = true;
}

function decide(id, val) {
  const k = edKey(currentEd), sim = SIM[k] || (SIM[k] = {});
  if (sim[id] === val) delete sim[id]; else sim[id] = val;
  $$(`[data-decide][data-id="${id}"]`).forEach(b => b.setAttribute('aria-pressed', String(sim[id] === b.dataset.decide)));
  renderCont(currentEd, calc(currentEd));
  const d = DEMANDES[id];
  if (d.type === 'phasage' && $('#phaseBars')) setPhase(sim[id] === 'refusee' ? 'sansReport' : 'avecReport');
  toast(sim[id] ? `${d.ref} ${sim[id] === 'validee' ? 'validée' : 'refusée'} dans la simulation` : `${d.ref} remise en attente`);
}

function resetSim() {
  delete SIM[edKey(currentEd)];
  $$('[data-decide]').forEach(b => b.setAttribute('aria-pressed', 'false'));
  renderCont(currentEd, calc(currentEd));
  if ($('#phaseBars')) setPhase('avecReport');
  toast('Simulation réinitialisée');
}

function filterAlerts(f) {
  $$('[data-filter]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.filter === f)));
  $$('#alertList .alert').forEach(a => { a.hidden = f !== 'all' && a.dataset.level !== f; });
}

/* ---------- Navigation dans les sections ---------- */
let spySecs = [], spyBtns = [];
function setupSpy() {
  spyBtns = $$('.subnav [data-target]');
  spySecs = spyBtns.map(b => document.getElementById(b.dataset.target)).filter(Boolean);
  spy();
}
function spy() {
  if (!spySecs.length) return;
  const off = $('.topbar').offsetHeight + 90;
  let cur = spySecs[0];
  spySecs.forEach(s => { if (s.getBoundingClientRect().top - off <= 0) cur = s; });
  if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) cur = spySecs[spySecs.length - 1];
  spyBtns.forEach(b => {
    const on = b.dataset.target === cur.id;
    if (on && !b.classList.contains('active')) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    b.classList.toggle('active', on);
  });
}
let spyRaf = 0;
addEventListener('scroll', () => { if (!spyRaf) spyRaf = requestAnimationFrame(() => { spyRaf = 0; spy(); }); }, { passive: true });

function scrollToSec(id) {
  document.getElementById(id)?.scrollIntoView({ behavior: reduceMotion.matches ? 'auto' : 'smooth', block: 'start' });
}

/* ---------- Panneau de détail d'une enveloppe ---------- */
let lastFocus = null;
const drawer = $('#drawer'), overlay = $('#overlay');

function renderDrawer(envId) {
  const ed = currentEd, c = calc(ed), rows = c.rows, i = rows.findIndex(r => r.id === envId), r = rows[i];
  const prev = rows[(i - 1 + rows.length) % rows.length], next = rows[(i + 1) % rows.length];
  const als = ed.alertes.filter(a => ALERTES[a[0]].env === envId);
  const dms = ed.demandes.filter(d => DEMANDES[d[0]].env === envId);
  drawer.innerHTML = `
    <div class="drawer-head">
      <div><p class="eyebrow">Enveloppe · séance du ${dShort(ed.date)}</p><h2 id="drawerTitle">${esc(r.nom)}</h2><span class="tone-muted">${esc(r.porteur)}</span></div>
      <button class="icon-btn" id="drawerClose" type="button" aria-label="Fermer le détail">${ICON.close}</button>
    </div>
    <div class="drawer-body">
      <div class="stat-label">Atterrissage</div>
      <div class="d-big"><span class="v num ${r.ecart > 0 ? 'tone-red' : ''}">${fmt(r.att)}${U}</span><span class="badge ${r.ecart > 0 ? '' : 'ok'}">${signed(r.ecart)} MMAD vs budget</span></div>
      <div class="d-grid">
        <div><div class="stat-label">Budget</div><div class="stat-value num">${fmt(r.budget)}${U}</div></div>
        <div><div class="stat-label">Engagé</div><div class="stat-value num">${fmt(r.eng)}${U}</div><div class="stat-sub">${pf.format(r.eng / r.att)} de l'atterrissage</div></div>
        <div><div class="stat-label">Reste à faire</div><div class="stat-value num">${fmt(r.raf)}${U}</div></div>
        <div><div class="stat-label">Δ séance</div><div class="stat-value num ${toneDelta(r.delta)}">${r.delta ? signed(r.delta) : '0,0'}${U}</div><div class="stat-sub">vs ${esc(ed.delta.ref)}</div></div>
      </div>
      <div class="d-sec"><h3>Consommation</h3>${cbar(r)}
        <div class="legend" style="margin-top:12px;font-size:13px"><span><i class="l-eng"></i>Engagé</span><span><i class="l-raf"></i>Reste à faire</span><span><i class="l-mark"></i>Budget</span></div></div>
      <div class="d-sec"><h3>Commentaire du porteur</h3><p>${esc(COMMENTAIRES[r.id] || '')}</p></div>
      <div class="d-sec"><h3>Alertes liées</h3>${als.length ? als.map(([id, niv, imp]) => `
        <div class="d-item"><span class="lvl ${niv}">${LVL[niv]}</span><strong>${esc(ALERTES[id].titre)}</strong><span>Impact estimé ${signed(imp)} MMAD, échéance ${dShort(ALERTES[id].echeance)}</span></div>`).join('')
        : '<p class="tone-muted">Aucune alerte sur cette enveloppe à cette séance.</p>'}</div>
      <div class="d-sec"><h3>Demandes liées</h3>${dms.length ? dms.map(([id, st, ech]) => {
        const d = DEMANDES[id];
        return `<div class="d-item"><strong>${d.ref} : ${esc(d.titre)}</strong><span>${d.type === 'economie' ? '−' : ''}${fmt(d.montant)} MMAD, ${st === 'attente' ? 'en attente, ' + esc(ech) : st === 'validee' ? 'validée en séance' : 'refusée en séance'}</span></div>`;
      }).join('') : '<p class="tone-muted">Aucune demande sur cette enveloppe à cette séance.</p>'}</div>
    </div>
    <div class="drawer-foot">
      <button class="btn-ghost" type="button" data-denv="${prev.id}" title="${esc(prev.nom)}">${ICON.prev} Précédente</button>
      <button class="btn-ghost" type="button" data-denv="${next.id}" title="${esc(next.nom)}">Suivante ${ICON.next}</button>
    </div>`;
}

function openDrawer(envId, trigger) {
  if (!currentEd) return;
  lastFocus = trigger || document.activeElement;
  renderDrawer(envId);
  overlay.hidden = false;
  requestAnimationFrame(() => { overlay.classList.add('show'); drawer.classList.add('open'); });
  document.body.style.overflow = 'hidden';
  setTimeout(() => $('#drawerClose')?.focus(), 60);
}
function closeDrawer() {
  if (!drawer.classList.contains('open')) return;
  overlay.classList.remove('show'); drawer.classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(() => { overlay.hidden = true; }, 260);
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
}
overlay.addEventListener('click', closeDrawer);
drawer.addEventListener('click', e => {
  if (e.target.closest('#drawerClose')) return closeDrawer();
  const n = e.target.closest('[data-denv]');
  if (n) { renderDrawer(n.dataset.denv); $('#drawerClose').focus(); }
});

/* ---------- Notification ---------- */
let toastTimer = 0;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- Évènements ---------- */
app.addEventListener('click', e => {
  const env = e.target.closest('[data-env]');
  if (env) return openDrawer(env.dataset.env, env);
  const tgt = e.target.closest('[data-target]');
  if (tgt) return scrollToSec(tgt.dataset.target);
  const dec = e.target.closest('[data-decide]');
  if (dec) return decide(dec.dataset.id, dec.dataset.decide);
  const f = e.target.closest('[data-filter]');
  if (f) return filterAlerts(f.dataset.filter);
  const ph = e.target.closest('[data-phase]');
  if (ph) return setPhase(ph.dataset.phase);
  const act = e.target.closest('[data-action]');
  if (act) { if (act.dataset.action === 'print') window.print(); else if (act.dataset.action === 'reset-sim') resetSim(); return; }
  const row = e.target.closest('tr[data-href]');
  if (row && !e.target.closest('a')) location.hash = row.dataset.href;
});
app.addEventListener('keydown', e => {
  const row = e.target.closest('tr[data-env]');
  if (row && e.target === row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDrawer(row.dataset.env, row); }
});

document.addEventListener('keydown', e => {
  if (drawer.classList.contains('open')) {
    if (e.key === 'Escape') { e.preventDefault(); closeDrawer(); }
    else if (e.key === 'Tab') {
      const f = $$('button, [href], [tabindex]:not([tabindex="-1"])', drawer);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    return;
  }
  if (!currentEd || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const a = document.activeElement;
  if (a && (/INPUT|TEXTAREA|SELECT/.test(a.tagName) || a.closest('.chart, .tbl-wrap, .subnav-inner'))) return;
  const eds = editionsOf(currentEd.instance), i = eds.indexOf(currentEd);
  const t = e.key === 'ArrowLeft' ? eds[i + 1] : eds[i - 1];
  if (t) location.hash = edHash(t);
});

/* ---------- Routeur ---------- */
function route() {
  closeDrawer();
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  let ed = null;
  if (parts[0] === 'seance') ed = EDITIONS.find(e => e.instance === parts[1] && e.date === parts[2]) || null;
  else if (parts[0] === 'instance') ed = latestOf(parts[1]) || null;
  if (ed) renderDashboard(ed); else { watchResize(null); spySecs = []; renderHome(); }
  window.scrollTo(0, 0);
  app.focus({ preventScroll: true });
}

applyTheme();
addEventListener('hashchange', route);
route();
})();
</script>
</body>
